spring.application.name=how_prom

# DB 설정
spring.datasource.url=jdbc:mysql://localhost:3306/prompt_platform?useSSL=false&serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=본인DB비밀번호
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# LLM API 설정
llm.base-url=https://api.anthropic.com
llm.api-key=발급받은_API_KEY
llm.model=claude-sonnet-4-6
llm.system-prompt-tokens=42

# 서버 포트
server.port=8080