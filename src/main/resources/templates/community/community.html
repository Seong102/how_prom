<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다른 풀이 보기 - HowProm</title>
    <style>
        :root {
            --hp-primary:       #5B47D6;
            --hp-primary-hover: #4a38c4;
            --hp-primary-soft:  #F0EEFB;
            --hp-bg:            #F5F6FA;
            --hp-surface:       #FFFFFF;
            --hp-text:          #1A1A1A;
            --hp-text-muted:    #6B7280;
            --hp-border:        #E5E7EB;
            --hp-border-soft:   #EEF0F3;
            --hp-success-bg:    #E6F7EC;
            --hp-success-text:  #1F9D55;
            --hp-danger-bg:     #FDECEC;
            --hp-danger-text:   #D14343;
            --hp-radius:        12px;
            --hp-radius-sm:     6px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "Apple SD Gothic Neo", "Malgun Gothic", Roboto, sans-serif;
            background: var(--hp-bg);
            color: var(--hp-text);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex; flex-direction: column;
        }
        a { text-decoration: none; color: inherit; }

        /* ── 헤더 ── */
        .hp-header {
            background: var(--hp-surface);
            border-bottom: 1px solid var(--hp-border);
            position: sticky; top: 0; z-index: 100; flex-shrink: 0;
        }
        .hp-header__inner {
            max-width: 1400px; margin: 0 auto; padding: 0 32px;
            height: 64px; display: flex; align-items: center; justify-content: space-between;
        }
        .hp-header__left { display: flex; align-items: center; gap: 48px; }
        .hp-logo { font-size: 22px; font-weight: 700; color: var(--hp-primary); letter-spacing: -0.5px; }
        .hp-nav  { display: flex; align-items: center; gap: 8px; }
        .hp-nav__link {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 12px; font-size: 14px; color: var(--hp-text-muted);
            border-bottom: 2px solid transparent; transition: color .15s;
        }
        .hp-nav__link:hover { color: var(--hp-text); }
        .hp-nav__link--active { color: var(--hp-primary); border-bottom-color: var(--hp-primary); }
        .hp-nav__icon { flex-shrink: 0; }
        .hp-header__user {
            display: inline-flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; border-radius: 50%; color: var(--hp-text-muted);
            transition: background-color .15s;
        }
        .hp-header__user:hover { background: var(--hp-border-soft); }

        /* ── 서브 헤더 ── */
        .sub-header {
            background: var(--hp-surface);
            border-bottom: 1px solid var(--hp-border);
            padding: 12px 32px;
            display: flex; align-items: center; gap: 12px;
        }
        .btn-back {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 5px 12px; border: 1px solid var(--hp-border);
            border-radius: var(--hp-radius-sm); font-size: 12px;
            color: var(--hp-text-muted); background: var(--hp-surface);
            cursor: pointer; font-family: inherit; transition: background .15s;
        }
        .btn-back:hover { background: var(--hp-bg); }
        .sub-title { font-size: 14px; font-weight: 600; color: var(--hp-text); }
        .sub-meta  { font-size: 12px; color: var(--hp-text-muted); }

        /* ── 메인 ── */
        .main-content {
            flex: 1;
            max-width: 860px; width: 100%;
            margin: 28px auto 48px; padding: 0 24px;
        }

        /* ── 섹션 헤더 ── */
        .section-head {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 14px;
        }
        .section-title {
            font-size: 15px; font-weight: 700; color: var(--hp-text);
        }
        .section-count {
            font-size: 12px; color: var(--hp-text-muted);
        }

        /* ── 카드 테이블 ── */
        .card {
            background: var(--hp-surface);
            border: 1px solid var(--hp-border);
            border-radius: var(--hp-radius);
            overflow: hidden;
        }
        .tbl {
            width: 100%; border-collapse: collapse;
        }
        .tbl thead th {
            padding: 10px 16px;
            font-size: 11px; font-weight: 600; color: var(--hp-text-muted);
            text-transform: uppercase; letter-spacing: 0.7px;
            background: var(--hp-bg);
            border-bottom: 1px solid var(--hp-border);
            text-align: left;
        }
        .tbl thead th.th-center { text-align: center; }
        .tbl thead th.th-right  { text-align: right; }

        .tbl tbody tr {
            border-bottom: 1px solid var(--hp-border-soft);
            transition: background .12s;
        }
        .tbl tbody tr:last-child { border-bottom: none; }
        .tbl tbody tr:hover { background: var(--hp-bg); }

        .tbl tbody td {
            padding: 13px 16px;
            font-size: 13.5px; color: var(--hp-text);
            vertical-align: middle;
        }
        .tbl tbody td.td-center { text-align: center; }
        .tbl tbody td.td-right  { text-align: right; }

        /* ── 순위 뱃지 ── */
        .rank-badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 26px; height: 26px; border-radius: 50%;
            font-size: 11px; font-weight: 700;
        }
        .rank-1 { background: #FFD700; color: #7a5a00; }
        .rank-2 { background: #D8D8D8; color: #505050; }
        .rank-3 { background: #E8B88A; color: #7a4000; }
        .rank-n { background: var(--hp-border-soft); color: var(--hp-text-muted); }

        /* ── 점수 pill ── */
        .score-pill {
            display: inline-block; padding: 3px 10px;
            border-radius: 20px; font-size: 12px; font-weight: 700;
        }
        .pill-pass { background: var(--hp-success-bg); color: var(--hp-success-text); }

        /* ── 풀이 보기 버튼 ── */
        .btn-view {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 5px 12px;
            border: 1px solid var(--hp-primary);
            border-radius: var(--hp-radius-sm);
            font-size: 12px; font-weight: 600; color: var(--hp-primary);
            background: var(--hp-primary-soft);
            cursor: pointer; transition: background .15s;
            font-family: inherit;
        }
        .btn-view:hover { background: var(--hp-primary); color: #fff; }

        /* ── 빈 상태 ── */
        .empty-state {
            padding: 60px 24px;
            text-align: center;
            color: var(--hp-text-muted);
            font-size: 14px;
        }
        .empty-state svg { margin-bottom: 12px; opacity: .4; }
        .empty-state p { margin-top: 6px; font-size: 12px; }

        /* ── 날짜 ── */
        .date-text { font-size: 12px; color: var(--hp-text-muted); }
    </style>
</head>
<body>

<!-- 헤더 -->
<header class="hp-header">
    <div class="hp-header__inner">
        <div class="hp-header__left">
            <a href="/" class="hp-logo">HowProm</a>
            <nav class="hp-nav">
                <a href="/" class="hp-nav__link">
                    <svg class="hp-nav__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    <span>대시보드</span>
                </a>
                <a href="/problems" class="hp-nav__link">
                    <svg class="hp-nav__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
                        <line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/>
                        <line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
                    </svg>
                    <span>문제</span>
                </a>
                <a href="/mypage" class="hp-nav__link">
                    <svg class="hp-nav__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span>마이페이지</span>
                </a>
            </nav>
        </div>
        <div class="hp-header__right">
            <a href="/profile" class="hp-header__user" aria-label="내 정보">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </a>
        </div>
    </div>
</header>

<!-- 서브 헤더 -->
<div class="sub-header">
    <button class="btn-back" onclick="history.back()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
        채점 결과
    </button>
    <div>
        <div class="sub-title">다른 풀이 보기</div>
        <div class="sub-meta">통과한 다른 유저들의 풀이입니다</div>
    </div>
</div>

<!-- 메인 -->
<div class="main-content">

    <div class="section-head">
        <span class="section-title">통과한 풀이 목록</span>
        <span class="section-count"
              th:text="${submissions.size() + '개'}">0개</span>
    </div>

    <div class="card">

        <!-- 데이터 있을 때 -->
        <table class="tbl" th:if="${!submissions.isEmpty()}">
            <thead>
                <tr>
                    <th class="th-center" style="width: 56px;">순위</th>
                    <th>닉네임</th>
                    <th class="th-center">점수</th>
                    <th class="th-center">사용 토큰</th>
                    <th class="th-right">제출일</th>
                    <th class="th-center" style="width: 100px;"></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="sub, stat : ${submissions}">
                    <td class="td-center">
                        <span th:class="${stat.index == 0} ? 'rank-badge rank-1'
                                      : ${stat.index == 1} ? 'rank-badge rank-2'
                                      : ${stat.index == 2} ? 'rank-badge rank-3'
                                      : 'rank-badge rank-n'"
                              th:text="${stat.count}">1</span>
                    </td>
                    <td th:text="${sub.nickname}">홍길동</td>
                    <td class="td-center">
                        <span class="score-pill pill-pass"
                              th:text="${sub.score + ' / 100'}">92 / 100</span>
                    </td>
                    <td class="td-center" th:text="${sub.totalUserTokens}">280</td>
                    <td class="td-right">
                        <span class="date-text"
                              th:text="${#temporals.format(sub.submittedAt, 'yyyy.MM.dd')}">2025.01.01</span>
                    </td>
                    <td class="td-center">
                        <button class="btn-view"
                                th:onclick="|location.href='/community/submissions/${sub.submissionId}'|">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            풀이 보기
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- 데이터 없을 때 -->
        <div class="empty-state" th:if="${submissions.isEmpty()}">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="10"/>
                <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
            <div>아직 다른 풀이가 없습니다.</div>
            <p>이 문제를 통과한 다른 유저가 없거나 본인만 통과했습니다.</p>
        </div>

    </div>
</div>

</body>
</html>
