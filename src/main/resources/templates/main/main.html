<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대시보드 - HowProm</title>

    <!-- 공통 스타일 -->
    <th:block th:replace="~{common/header :: styles}"></th:block>

    <style>
        /* ===== Layout ===== */
        .hp-main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 32px 80px;
        }

        /* ===== Page header ===== */
        .hp-page-header {
            margin-bottom: 28px;
        }

        .hp-page-header__title {
            margin: 0 0 6px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .hp-page-header__subtitle {
            margin: 0;
            font-size: 14px;
            color: var(--hp-text-muted);
        }

        /* ===== Stats cards ===== */
        .hp-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }

        .hp-stat-card {
            background-color: var(--hp-surface);
            border: 1px solid var(--hp-border);
            border-radius: var(--hp-radius);
            padding: 22px 28px;
            box-shadow: var(--hp-shadow);
        }

        .hp-stat-card__label {
            font-size: 13px;
            color: var(--hp-text-muted);
            margin-bottom: 10px;
        }

        .hp-stat-card__value {
            font-size: 32px;
            font-weight: 700;
            color: var(--hp-primary);
            letter-spacing: -0.5px;
        }

        /* ===== Recent submissions ===== */
        .hp-card {
            background-color: var(--hp-surface);
            border: 1px solid var(--hp-border);
            border-radius: var(--hp-radius);
            box-shadow: var(--hp-shadow);
            overflow: hidden;
            margin-bottom: 28px;
        }

        .hp-card__header {
            padding: 18px 28px;
            border-bottom: 1px solid var(--hp-border-soft);
            font-size: 15px;
            font-weight: 600;
        }

        .hp-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .hp-table thead th {
            text-align: left;
            padding: 14px 28px;
            font-size: 13px;
            font-weight: 500;
            color: var(--hp-text-muted);
            background-color: #FAFBFC;
            border-bottom: 1px solid var(--hp-border-soft);
        }

        .hp-table tbody td {
            padding: 16px 28px;
            border-bottom: 1px solid var(--hp-border-soft);
            color: var(--hp-text);
        }

        .hp-table tbody tr:last-child td {
            border-bottom: none;
        }

        .hp-table__score {
            color: var(--hp-primary);
            font-weight: 600;
        }

        .hp-table__date {
            color: var(--hp-text-muted);
        }

        /* ===== Status badge ===== */
        .hp-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: var(--hp-radius-sm);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .hp-badge--success {
            background-color: var(--hp-success-bg);
            color: var(--hp-success-text);
        }

        .hp-badge--danger {
            background-color: var(--hp-danger-bg);
            color: var(--hp-danger-text);
        }

        /* ===== Action cards ===== */
        .hp-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .hp-action-card {
            display: block;
            padding: 28px;
            border-radius: var(--hp-radius);
            border: 2px solid transparent;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            cursor: pointer;
        }

        .hp-action-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(91, 71, 214, 0.15);
        }

        .hp-action-card--primary {
            background-color: var(--hp-primary);
            color: #fff;
        }

        .hp-action-card--outline {
            background-color: var(--hp-surface);
            border-color: var(--hp-primary);
            color: var(--hp-primary);
        }

        .hp-action-card__title {
            margin: 0 0 8px;
            font-size: 18px;
            font-weight: 700;
        }

        .hp-action-card__desc {
            margin: 0;
            font-size: 13px;
            opacity: 0.9;
        }

        .hp-action-card--outline .hp-action-card__desc {
            color: var(--hp-text-muted);
            opacity: 1;
        }

        /* ===== Responsive ===== */
        @media (max-width: 900px) {
            .hp-stats { grid-template-columns: 1fr; }
            .hp-actions { grid-template-columns: 1fr; }
        }

        @media (max-width: 600px) {
            .hp-main { padding: 24px 16px 60px; }
            .hp-page-header__title { font-size: 24px; }
            .hp-stat-card { padding: 18px 20px; }
            .hp-stat-card__value { font-size: 28px; }
            .hp-table thead th,
            .hp-table tbody td { padding: 12px 16px; }
            .hp-card__header { padding: 16px 20px; }
        }
    </style>
</head>
<body>

<!-- 헤더 fragment include (현재 페이지: dashboard) -->
<div th:replace="~{common/header :: header('dashboard')}"></div>

<main class="hp-main">

    <!-- 페이지 헤더 -->
    <section class="hp-page-header">
        <h1 class="hp-page-header__title">대시보드</h1>
        <p class="hp-page-header__subtitle">AI 프롬프트 작성 실력을 향상시키세요</p>
    </section>

    <!-- 통계 카드 -->
    <section class="hp-stats">
        <div class="hp-stat-card">
            <div class="hp-stat-card__label">해결한 문제</div>
            <div class="hp-stat-card__value" th:text="${stats?.solvedCount ?: 42}">42</div>
        </div>
        <div class="hp-stat-card">
            <div class="hp-stat-card__label">성공률</div>
            <div class="hp-stat-card__value">
                <span th:text="${stats?.successRate ?: 78}">78</span>%
            </div>
        </div>
        <div class="hp-stat-card">
            <div class="hp-stat-card__label">평균 토큰</div>
            <div class="hp-stat-card__value" th:text="${stats?.avgTokens ?: 312}">312</div>
        </div>
    </section>

    <!-- 최근 제출 -->
    <section class="hp-card">
        <header class="hp-card__header">최근 제출</header>
        <table class="hp-table">
            <thead>
                <tr>
                    <th>문제명</th>
                    <th>점수</th>
                    <th>제출일</th>
                    <th>상태</th>
                </tr>
            </thead>
            <tbody>
                <!-- 동적 데이터 (recentSubmissions가 있으면 사용) -->
                <tr th:each="sub : ${recentSubmissions}" th:if="${recentSubmissions != null and !recentSubmissions.isEmpty()}">
                    <td th:text="${sub.problemName}">문제명</td>
                    <td class="hp-table__score" th:text="${sub.score}">0</td>
                    <td class="hp-table__date" th:text="${sub.submittedAt}">YYYY-MM-DD</td>
                    <td>
                        <span class="hp-badge"
                              th:classappend="${sub.passed} ? 'hp-badge--success' : 'hp-badge--danger'"
                              th:text="${sub.passed} ? 'PASSED' : 'FAILED'">PASSED</span>
                    </td>
                </tr>

                <!-- 정적 fallback 데이터 (데이터가 없을 때 디자인 확인용) -->
                <th:block th:if="${recentSubmissions == null or recentSubmissions.isEmpty()}">
                    <tr>
                        <td>Two Sum 프롬프트</td>
                        <td class="hp-table__score">88</td>
                        <td class="hp-table__date">2026-05-14</td>
                        <td><span class="hp-badge hp-badge--success">PASSED</span></td>
                    </tr>
                    <tr>
                        <td>이진 탐색 생성기</td>
                        <td class="hp-table__score">92</td>
                        <td class="hp-table__date">2026-05-13</td>
                        <td><span class="hp-badge hp-badge--success">PASSED</span></td>
                    </tr>
                    <tr>
                        <td>피보나치 최적화</td>
                        <td class="hp-table__score">58</td>
                        <td class="hp-table__date">2026-05-12</td>
                        <td><span class="hp-badge hp-badge--danger">FAILED</span></td>
                    </tr>
                    <tr>
                        <td>배열 조작</td>
                        <td class="hp-table__score">88</td>
                        <td class="hp-table__date">2026-05-11</td>
                        <td><span class="hp-badge hp-badge--success">PASSED</span></td>
                    </tr>
                </th:block>
            </tbody>
        </table>
    </section>

    <!-- 액션 카드 -->
    <section class="hp-actions">
        <a th:href="@{/problems}" class="hp-action-card hp-action-card--primary">
            <h3 class="hp-action-card__title">문제 풀기</h3>
            <p class="hp-action-card__desc">다양한 문제를 풀어보세요</p>
        </a>
        <a th:href="@{/community}" class="hp-action-card hp-action-card--outline">
            <h3 class="hp-action-card__title">커뮤니티</h3>
            <p class="hp-action-card__desc">다른 사용자의 풀이를 확인하세요</p>
        </a>
    </section>

</main>

</body>
</html>
