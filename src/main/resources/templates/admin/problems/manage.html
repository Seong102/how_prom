<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>HowProm - 문제 목록 관리</title>
<meta name="_csrf" th:content="${_csrf?.token}" />
<meta name="_csrf_header" th:content="${_csrf?.headerName}" />

<th:block th:replace="~{common/header :: styles}"></th:block>
<th:block th:replace="~{common/header :: profile-modal-script}"></th:block>
<link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

	<div th:replace="~{common/header :: header('admin')}"></div>

	<main class="hp-main">

		<div class="hp-page-header--manage">
			<div>
				<h1 class="hp-page-header__title">
					문제 관리 <span class="hp-admin-badge">Admin</span>
				</h1>
			</div>
			<a th:href="@{/admin/problems/register}" class="hp-btn hp-btn--primary">+ 새 문제 등록</a>
		</div>
		
		<div th:replace="~{admin/adminSubNav :: subNav('manage')}"></div>

		<div class="hp-search-box">
			<select id="filterManage" class="hp-sort-btn" onchange="toggleSearchInput()" style="width: 110px;">
				<option value="title">제목</option>
				<option value="id">번호</option>
				<option value="type">유형</option>
			</select> 
			
			<input type="text" id="searchManageText"
				class="hp-search-input hp-manage-filter-input"
				placeholder="검색어 입력..." onkeyup="searchManageAdvanced()">

			<select id="searchManageType" class="hp-sort-btn hp-manage-filter-input" onchange="searchManageAdvanced()" style="display: none;">
				<option value="">유형 전체</option>
				<option value="standard">Standard</option>
				<option value="efficiency">Efficiency</option>
				<option value="budget">Budget</option>
			</select> 

			<div class="hp-chip-divider"></div>
			
			<button type="button" class="hp-chip-btn is-active" data-chip-type="all" onclick="quickFilterProblems('all', this)">전체 문항</button>
			<button type="button" class="hp-chip-btn" data-chip-type="hidden" onclick="quickFilterProblems('hidden', this)">비공개</button>
			<button type="button" class="hp-chip-btn" data-chip-type="complex" onclick="quickFilterProblems('complex', this)">고난도 (조건 3개+)</button>

			<button type="button" class="hp-btn hp-btn--outline" onclick="resetManageFilter()" style="margin-left: auto;">필터/정렬 초기화</button>
		</div>

		<div class="hp-card">
			<div class="hp-card__header">전체 출제 문항 마스터 레코드</div>
			<div class="hp-card__body hp-card__body--nopadding">
				<div class="hp-manage-table-scroll">
					<table class="hp-table" id="problemManageTable">
						<thead>
							<tr>
								<th style="width: 10%; padding-left: 24px; cursor: pointer;" onclick="sortTable('problemManageTable', 0)" title="클릭하여 정렬">번호 ↕</th>
								<th style="width: 30%; cursor: pointer;" onclick="sortTable('problemManageTable', 1)" title="클릭하여 정렬">제목 ↕</th>
								<th style="width: 13%; text-align: center; cursor: pointer;" onclick="sortTable('problemManageTable', 2)" title="클릭하여 정렬">유형 ↕</th>
								<th style="width: 13%; text-align: center;">공개 여부</th>
								<th class="text-center" style="width: 10%; cursor: pointer;" onclick="sortTable('problemManageTable', 4)" title="클릭하여 정렬">제출 수 ↕</th>
								<th class="text-center" style="width: 11%; cursor: pointer;" onclick="sortTable('problemManageTable', 5)" title="클릭하여 정렬">평균 점수 ↕</th>
								<th class="text-center" style="width: 13%; white-space: nowrap;">관리</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="prob : ${problemList}" class="hp-prob-row">
								<td style="padding-left: 24px;" th:text="'#' + ${#numbers.formatInteger(prob.id, 3)}" th:data-sort-value="${prob.id}">#001</td>
								<td th:data-sort-value="${prob.title}"><strong th:text="${prob.title}">문제 제목 명세</strong></td>

								<td class="text-center" th:data-sort-value="${prob.evaluationType}" th:data-sort-req="${prob.requirementsCount}">
									<div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
										<span class="hp-badge hp-badge--standard" th:if="${prob.evaluationType == 'STANDARD'}">Standard</span>
										<span class="hp-badge hp-badge--efficiency" th:if="${prob.evaluationType == 'EFFICIENCY'}">Efficiency</span>
										<span class="hp-badge hp-badge--budget" th:if="${prob.evaluationType == 'BUDGET'}">Budget</span> 
										<span class="hp-text-muted" style="font-size: 11px; font-weight: 500;" th:text="'조건 ' + ${prob.requirementsCount} + '개'">조건 0개</span>
									</div>
								</td>

								<td class="text-center" th:data-sort-value="${prob.isPublic ? 1 : 0}">
									<label class="hp-switch" style="justify-content: center;"> 
										<input type="checkbox" class="hp-switch__input" th:checked="${prob.isPublic}" th:attr="data-id=${prob.id}">
										<span class="hp-switch__slider"></span> 
										<span class="hp-switch__label hp-status-text" th:text="${prob.isPublic} ? '공개' : '비공개'">비공개</span>
									</label>
								</td>

								<td class="text-center" th:data-sort-value="${statsMap != null && statsMap.containsKey(prob.id) ? statsMap[prob.id].totalCount : 0}">
									<span th:text="${statsMap != null && statsMap.containsKey(prob.id) ? statsMap[prob.id].totalCount + '건' : '0건'}">0건</span>
								</td>

								<td class="text-center hp-text-muted" style="font-weight: 600;" th:data-sort-value="${statsMap != null && statsMap.containsKey(prob.id) && statsMap[prob.id].avgScore != null ? statsMap[prob.id].avgScore : -1}">
									<span th:text="${statsMap != null && statsMap.containsKey(prob.id) && statsMap[prob.id].avgScore != null ? #numbers.formatDecimal(statsMap[prob.id].avgScore, 1, 1) + '점' : '-'}">-</span>
									<div th:if="${statsMap != null && statsMap.containsKey(prob.id) && statsMap[prob.id].passRate != null}" style="font-size: 11px; font-weight: 500; color: #2b8a3e; margin-top: 3px;">
										(🎯 통과 <span th:text="${#numbers.formatDecimal(statsMap[prob.id].passRate, 1, 0)}">0</span>%)
									</div>
								</td>

								<td class="text-center" style="white-space: nowrap;">
									<div class="hp-action-group" style="display: flex; gap: 6px; justify-content: center; align-items: center;">
										<a th:href="@{/admin/problems/edit/{id}(id=${prob.id})}" class="hp-btn hp-btn--outline">수정</a>
										<button type="button" class="hp-btn hp-btn--danger-outline" th:onclick="|deleteProblem('${prob.id}')|">삭제</button>
									</div>
								</td>
							</tr>

							<tr id="noDataRow" style="display: none;">
								<td colspan="7" class="hp-text-muted" style="text-align: center; padding: 40px 0; font-size: 14px;">
									검색 조건과 일치하는 관리 문항이 존재하지 않습니다.</td>
							</tr>
							<tr id="emptyDataRow" th:if="${#lists.isEmpty(problemList)}">
								<td colspan="7" class="hp-text-muted" style="text-align: center; padding: 40px 0; font-size: 14px;">
									출제 등록된 프롬프트 문제가 존재하지 않습니다.</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</main>

	<script th:inline="javascript">
    const sortState = {};
    let originalRows = []; 

    /* 통합 필터 처리 함수 */
    function applyFilters() {
        const activeChip = document.querySelector('.hp-chip-btn.is-active');
        const quickFilterType = activeChip ? activeChip.getAttribute('data-chip-type') : 'all';

        const filterType = document.getElementById('filterManage').value;
        let keyword = '';
        if (filterType === 'title' || filterType === 'id') {
            keyword = document.getElementById('searchManageText').value.toLowerCase().trim();
        } else if (filterType === 'type') {
            keyword = document.getElementById('searchManageType').value.toLowerCase();
        }

        const tbody = document.getElementById('problemManageTable').querySelector('tbody');
        const rows = tbody.querySelectorAll('.hp-prob-row');
        let visibleCount = 0;

        rows.forEach(row => {
            const reqCell = row.cells[2];
            const reqCount = parseInt(reqCell.getAttribute('data-sort-req') || '0', 10);
            const statusText = row.querySelector('.hp-status-text')?.innerText.trim() || '';

            let isQuickMatch = false;
            if (quickFilterType === 'all') {
                isQuickMatch = true;
            } else if (quickFilterType === 'hidden') {
                isQuickMatch = (statusText === '비공개');
            } else if (quickFilterType === 'complex') {
                isQuickMatch = (reqCount >= 3);
            }

            let isSearchMatch = false;
            if (!keyword) {
                isSearchMatch = true; 
            } else {
                const idText = row.cells[0]?.innerText.toLowerCase() ?? '';
                const titleText = row.cells[1]?.innerText.toLowerCase() ?? '';
                const typeText = row.cells[2]?.getAttribute('data-sort-value')?.toLowerCase() ?? '';

                if (filterType === 'id') {
                    isSearchMatch = idText.includes(keyword) || idText.replace('#', '').includes(keyword);
                } else if (filterType === 'title') {
                    isSearchMatch = titleText.includes(keyword);
                } else if (filterType === 'type') {
                    isSearchMatch = typeText.includes(keyword);
                }
            }

            if (isQuickMatch && isSearchMatch) {
                row.style.display = '';
                visibleCount++;
            } else {
                row.style.display = 'none';
            }
        });

        const noDataRow = document.getElementById('noDataRow');
        const hasEmptyWarning = tbody.querySelector('#emptyDataRow') !== null;
        if (noDataRow) {
            noDataRow.style.display = (visibleCount === 0 && !hasEmptyWarning) ? '' : 'none';
        }
    }

    function quickFilterProblems(type, element) {
        document.querySelectorAll('.hp-chip-btn').forEach(btn => btn.classList.remove('is-active'));
        if (element) element.classList.add('is-active');
        applyFilters(); 
    }

    /* 검색창 입력 이벤트 */
    function searchManageAdvanced() {
        applyFilters(); 
    }

    function toggleSearchInput() {
        const filterType = document.getElementById('filterManage').value;
        const textInput = document.getElementById('searchManageText');
        const typeSelect = document.getElementById('searchManageType');

        textInput.value = '';
        typeSelect.value = '';

        textInput.style.display = (filterType === 'title' || filterType === 'id') ? '' : 'none';
        typeSelect.style.display = (filterType === 'type') ? '' : 'none';

        applyFilters(); 
    }

    /* 테이블 내 데이터 정렬 로직 (th[onclick] 기반 동적 텍스트 치환 안전성 유지) */
    function sortTable(tableId, colIndex) {
        const table = document.getElementById(tableId);
        const tbody = table.querySelector('tbody');
        const rows = Array.from(tbody.querySelectorAll('.hp-prob-row')); 

        sortState[tableId + colIndex] = !sortState[tableId + colIndex];
        const asc = sortState[tableId + colIndex];

        rows.sort((a, b) => {
            const aCell = a.cells[colIndex];
            const bCell = b.cells[colIndex];
            
            let aVal = aCell.getAttribute('data-sort-value') ?? aCell.innerText.trim();
            let bVal = bCell.getAttribute('data-sort-value') ?? bCell.innerText.trim();

            if (colIndex === 2) {
                const primaryCompare = asc ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
                if (primaryCompare === 0) {
                    const aReq = parseInt(aCell.getAttribute('data-sort-req') ?? 0, 10);
                    const bReq = parseInt(bCell.getAttribute('data-sort-req') ?? 0, 10);
                    return aReq - bReq;
                }
                return primaryCompare;
            }

            const aNum = parseFloat(aVal);
            const bNum = parseFloat(bVal);
            
            if (!isNaN(aNum) && !isNaN(bNum)) {
                return asc ? aNum - bNum : bNum - aNum;
            }
            return asc ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
        });

        rows.forEach(row => tbody.appendChild(row));
        
        const noDataRow = document.getElementById('noDataRow');
        if (noDataRow) tbody.appendChild(noDataRow);
        const emptyDataRow = document.getElementById('emptyDataRow');
        if (emptyDataRow) tbody.appendChild(emptyDataRow);

        // onclick 속성을 가진 헤더만 찾아 화살표 기호 안전하게 업데이트
        const headers = table.querySelectorAll('thead th[onclick]');
        headers.forEach(th => {
            const base = th.innerText.replace(/ [↑↓↕]$/, '');
            const onclickAttr = th.getAttribute('onclick') || '';
            const match = onclickAttr.match(/\d+(?=\))/); 
            if (match) {
                const idx = parseInt(match[0], 10);
                th.innerText = base + (idx === colIndex ? (asc ? ' ↑' : ' ↓') : ' ↕');
            }
        });
    }

    function resetManageFilter() {
        document.getElementById('filterManage').value = 'title';
        
        const textInput = document.getElementById('searchManageText');
        const typeSelect = document.getElementById('searchManageType');
        textInput.value = '';
        typeSelect.value = '';
        textInput.style.display = '';
        typeSelect.style.display = 'none';

        document.querySelectorAll('.hp-chip-btn').forEach(btn => btn.classList.remove('is-active'));
        const allChip = document.querySelector('.hp-chip-btn[data-chip-type="all"]');
        if (allChip) allChip.classList.add('is-active');

        const table = document.getElementById('problemManageTable');
        const tbody = table.querySelector('tbody');
        originalRows.forEach(row => tbody.appendChild(row));
        originalRows.forEach(row => row.style.display = '');

        const noDataRow = document.getElementById('noDataRow');
        if (noDataRow) noDataRow.style.display = 'none';
        const emptyDataRow = document.getElementById('emptyDataRow');
        if (emptyDataRow) tbody.appendChild(emptyDataRow);

        const headers = table.querySelectorAll('thead th[onclick]');
        headers.forEach(th => {
            th.innerText = th.innerText.replace(/ [↑↓↕]$/, '') + ' ↕';
        });

        for (const key in sortState) {
            delete sortState[key];
        }

        applyFilters();
    }

    document.addEventListener("DOMContentLoaded", function() {
        const tbody = document.getElementById('problemManageTable').querySelector('tbody');
        originalRows = Array.from(tbody.querySelectorAll('.hp-prob-row'));

        const message = /*[[${message}]]*/ null;
        if (message && message !== 'default') {
            alert(message);
        }
    });

    document.querySelectorAll('.hp-switch__input').forEach(checkbox => {
        checkbox.addEventListener('change', function() {
            const isPublic = this.checked;
            const id = this.getAttribute('data-id');
            const labelEl = this.closest('.hp-switch').querySelector('.hp-switch__label');
            const tdEl = this.closest('td'); 
            
            const token = document.querySelector('meta[name="_csrf"]').getAttribute('content');
            const header = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

            fetch('/admin/problems/toggle/' + id + '?isPublic=' + isPublic, { 
                method: 'POST',
                headers: {
                    [header]: token
                }
            }).then(response => {
                if (response.ok) {
                    labelEl.textContent = isPublic ? '공개' : '비공개';
                    tdEl.setAttribute('data-sort-value', isPublic ? '1' : '0'); 
                    applyFilters();
                } else {
                    alert('상태 변경에 실패했습니다.');
                    this.checked = !isPublic;
                    labelEl.textContent = !isPublic ? '공개' : '비공개';
                }
            }).catch(error => {
                console.error('Error:', error);
                alert('네트워크 오류가 발생했습니다.');
                this.checked = !isPublic;
                labelEl.textContent = !isPublic ? '공개' : '비공개';
            });
        });
    });

    function deleteProblem(id) {
        if (!confirm("정말 이 문제를 삭제하시겠습니까?")) return;
        
        const token = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        const header = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

        fetch(`/admin/problems/delete/${id}`, { 
            method: 'POST',
            headers: {
                [header]: token
            }
        })
        .then(async res => {
            if (res.ok) {
                alert("정상적으로 삭제되었습니다.");
                location.reload();
            } else {
                const message = await res.text();
                if (message.includes("<html>") || message.includes("<!DOCTYPE")) {
                    alert("삭제 처리에 실패하였습니다. (서버 내부 오류 또는 연관 데이터 존재)");
                } else {
                    alert("삭제 처리에 실패하였습니다.\n\n" + message);
                }
            }
        }).catch(error => {
            console.error('Error:', error);
            alert('삭제 중 네트워크 오류가 발생했습니다.');
        });
    }
    </script>
</body>
</html>
