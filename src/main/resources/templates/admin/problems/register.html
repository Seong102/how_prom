<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>문제 등록 및 수정 - HowProm Admin</title>
    <th:block th:replace="~{common/header :: styles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    </head>
<body>

<div th:replace="~{common/header :: header('admin')}"></div>

<main class="hp-main">
    <div class="hp-page-header--manage">
        <div>
            <h1 class="hp-page-header__title">
                <span id="pageTitle" th:text="${problem.id == null} ? '새 문제 등록' : '문제 수정'">새 문제 등록</span>
                <span class="hp-admin-badge">Admin</span>
            </h1>
        </div>
    </div>

    <div th:replace="~{admin/adminSubNav :: subNav('register')}"></div>

    <form id="problemForm" th:action="${problem.id == null} ? @{/admin/problems/register} : @{/admin/problems/edit/{id}(id=${problem.id})}" method="post">
        <div class="hp-dashboard-row">
            
            <section class="hp-card">
                <div class="hp-card__header">문제 기본 정보</div>
                <div class="hp-card__body">
                    <div class="hp-form-group">
                        <label>문제 제목</label>
                        <input type="text" name="title" class="hp-input" placeholder="문제 제목을 입력하세요" th:value="${problem.title}" required>
                    </div>
                    <div class="hp-form-group">
                        <label>문제 설명</label>
                        <textarea name="description" class="hp-textarea" rows="10" placeholder="구체적인 문제 정의를 입력하세요" th:text="${problem.description}" required></textarea>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="hp-form-group">
                            <label>평가 유형</label>
                            <select name="evaluationType" class="hp-input" required>
                                <option value="" disabled th:selected="${problem.evaluationType == null}">평가 유형을 선택하세요</option>
                                <option value="STANDARD" th:selected="${problem.evaluationType == 'STANDARD'}">STANDARD — 표준 모드</option>
                                <option value="EFFICIENCY" th:selected="${problem.evaluationType == 'EFFICIENCY'}">EFFICIENCY — 효율성 모드</option>
                                <option value="BUDGET" th:selected="${problem.evaluationType == 'BUDGET'}">BUDGET — 예산 최적화 모드</option>
                            </select>
                        </div>
                        <div class="hp-form-group">
                            <label>공개 여부</label>
                            <select name="isPublic" class="hp-input" required>
                                <option value="true" th:selected="${problem.isPublic == true}">공개 (바로 노출)</option>
                                <option value="false" th:selected="${problem.isPublic == false}">비공개 (숨김)</option>
                            </select>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px;">
                        <div class="hp-form-group hp-example-group">
                            <label>예시 입력</label>
                            <textarea name="exampleInput" class="hp-textarea" rows="4" th:text="${problem.exampleInput}"></textarea>
                        </div>
                        <div class="hp-form-group hp-example-group">
                            <label>예시 출력</label>
                            <textarea name="exampleOutput" class="hp-textarea" rows="4" th:text="${problem.exampleOutput}"></textarea>
                        </div>
                    </div>
                </div>
            </section>

            <section class="hp-card">
                <div class="hp-card__header" style="display: flex; justify-content: space-between; align-items: center;">
                    <span>요구사항 상세 설정</span>
                    <span id="scoreDisplay">배점 합계: <b>0</b> / 100</span>
                </div>
                <div class="hp-card__body">
                    
                    <div class="hp-form-group hp-optional-group" style="margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px dashed var(--hp-border-soft);">
                        <label>최대 토큰 제한량 (Token Limit)</label>
                        <input type="number" name="tokenLimit" class="hp-input" placeholder="예: 300 (미입력 시 제한 없음)" th:value="${problem.tokenLimit}" min="0">
                    </div>

                    <div id="reqList">
                        <div class="hp-req-row" th:if="${problem.requirements == null or #lists.isEmpty(problem.requirements)}">
                            <input type="text" name="reqDesc" class="hp-input" placeholder="요구사항 명세" required>
                            <input type="number" name="reqWeight" class="hp-input hp-weight" value="0" min="0" oninput="calc()">
                            <button type="button" class="hp-btn hp-btn--danger-outline hp-btn--del" disabled>×</button>
                        </div>

                        <div class="hp-req-row" th:if="${problem.requirements != null}" th:each="req, iterStat : ${problem.requirements}">
                            <input type="text" name="reqDesc" class="hp-input" th:value="${req.description}" placeholder="요구사항 명세" required>
                            <input type="number" name="reqWeight" class="hp-input hp-weight" th:value="${req.weight}" min="0" oninput="calc()">
                            
                            <button th:if="${iterStat.index == 0}" type="button" class="hp-btn hp-btn--danger-outline hp-btn--del" disabled>×</button>
                            <button th:if="${iterStat.index > 0}" type="button" class="hp-btn hp-btn--danger-outline hp-btn--del" onclick="this.parentElement.remove(); calc();">×</button>
                        </div>
                    </div>
                    
                    <button type="button" class="hp-btn hp-btn--outline" style="width: 100%; margin-top: 10px;" onclick="addReq()">+ 요구사항 항목 추가</button>
                    
                    <div style="margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--hp-border-soft);">
                        <button type="submit" id="submitBtn" class="hp-btn hp-btn--primary" style="width: 100%; padding: 12px;" th:text="${problem.id == null} ? '문제 등록 완료' : '문제 수정 완료'">문제 등록 완료</button>
                    </div>
                </div>
            </section>
        </div>
    </form>
</main>

<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function() {
        const serverMessage = /*[[${message}]]*/ null;
        if (serverMessage) {
            alert(serverMessage);
        }

        calc();

        const form = document.getElementById('problemForm');
        if (form) {
            form.addEventListener('submit', function(e) {
                // 🚨 [추가된 유효성 검사] 예산 최적화 모드 시 토큰량 필수 체크
                const evalType = document.querySelector('select[name="evaluationType"]').value;
                const tokenLimitInput = document.querySelector('input[name="tokenLimit"]');
                const tokenLimit = tokenLimitInput ? tokenLimitInput.value.trim() : "";

                if (evalType === 'BUDGET') {
                    if (!tokenLimit || Number(tokenLimit) <= 0) {
                        e.preventDefault(); // 폼 전송(페이지 이동) 강제 차단
                        alert("예산 최적화 모드에서는 토큰 제한량을 반드시 입력해야 합니다.");
                        if (tokenLimitInput) {
                            tokenLimitInput.focus(); // 입력창으로 커서 자동 이동
                        }
                        return;
                    }
                }

                // 기존 배점 합계 검사 로직
                let total = 0;
                document.querySelectorAll('.hp-weight').forEach(i => total += Math.round(Number(i.value) || 0));
                
                if (total !== 100) {
                    e.preventDefault();
                    alert(`배점 합계가 정확히 100점이어야 합니다.\n(현재 합계: ${total}점)`);
                    return;
                }
            });
        }
    });

    function addReq() {
        const div = document.createElement('div');
        div.className = 'hp-req-row';
        div.innerHTML = `
            <input type="text" name="reqDesc" class="hp-input" placeholder="요구사항 명세" required>
            <input type="number" name="reqWeight" class="hp-input hp-weight" value="0" min="0" oninput="calc()">
            <button type="button" class="hp-btn hp-btn--danger-outline hp-btn--del" onclick="this.parentElement.remove(); calc();">×</button>
        `;
        document.getElementById('reqList').appendChild(div);
        calc();
    }
    
    function calc() {
        let total = 0;
        const inputs = document.querySelectorAll('.hp-weight');
        
        inputs.forEach(i => total += Math.round(Number(i.value) || 0));
        
        const display = document.getElementById('scoreDisplay');
        const btn = document.getElementById('submitBtn');
        const isExactly100 = (total === 100);
        
        display.innerHTML = `배점 합계: <b style="color: ${isExactly100 ? '#2ECC71' : '#E74C3C'};">${total}</b> / 100`;
        
        btn.disabled = !isExactly100;
        btn.style.opacity = isExactly100 ? '1' : '0.5';
    }
</script>

<th:block th:replace="~{common/header :: profile-modal-script}"></th:block>

</body>
</html>
