<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채점 결과 - HowProm</title>
    <th:block th:replace="~{common/header :: styles}"></th:block>
    <style>
        * { margin: 0; padding: 0; }
        body { min-height: 100vh; display: flex; flex-direction: column; }

        /* ── 서브 헤더 ── */
        .sub-header {
            background: var(--hp-surface);
            border-bottom: 1px solid var(--hp-border);
            padding: 12px 32px;
            display: flex; align-items: center; gap: 12px;
        }
        .btn-back {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 5px 12px; border: 1px solid var(--hp-border);
            border-radius: var(--hp-radius-sm); font-size: 12px;
            color: var(--hp-text-muted); background: var(--hp-surface);
            cursor: pointer; font-family: inherit; transition: background .15s;
        }
        .btn-back:hover { background: var(--hp-bg); }
        .sub-title { font-size: 14px; font-weight: 600; color: var(--hp-text); }
        .sub-meta  { font-size: 12px; color: var(--hp-text-muted); }

        /* ── 스코어 히어로 ── */
        .score-hero {
            background: var(--hp-surface);
            border-bottom: 1px solid var(--hp-border);
            padding: 32px 24px 24px;
            text-align: center;
        }
        .score-big {
            font-size: 64px; font-weight: 800; line-height: 1;
            color: var(--hp-primary); letter-spacing: -3px;
        }
        .score-denom { font-size: 18px; color: var(--hp-text-muted); font-weight: 400; }
        .score-prob  {
            font-size: 13px; color: var(--hp-text-muted);
            margin-top: 6px; margin-bottom: 14px;
        }
        .status-badge {
            display: inline-block; padding: 4px 16px;
            border-radius: 20px; font-size: 12px; font-weight: 700; letter-spacing: 0.5px;
        }
        .badge-passed  { background: var(--hp-success-bg); color: var(--hp-success-text); }
        .badge-failed  { background: var(--hp-danger-bg);  color: var(--hp-danger-text); }
        .badge-error   { background: #FEF3C7; color: #D97706; }
        .badge-grading { background: var(--hp-bg); border: 1px solid var(--hp-border); color: var(--hp-text-muted); }

        /* ── 채점 중 배너 ── */
        .grading-banner {
            max-width: 900px; width: 100%;
            margin: 28px auto 0; padding: 0 24px;
        }
        .grading-card {
            background: var(--hp-surface);
            border: 1px solid var(--hp-border);
            border-radius: var(--hp-radius);
            padding: 40px 24px;
            text-align: center;
        }
        .spinner {
            width: 44px; height: 44px; margin: 0 auto 18px;
            border: 3px solid var(--hp-border);
            border-top-color: var(--hp-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .grading-title {
            font-size: 16px; font-weight: 700; color: var(--hp-text); margin-bottom: 6px;
        }
        .grading-desc {
            font-size: 13px; color: var(--hp-text-muted); margin-bottom: 20px;
        }
        .grading-elapsed {
            font-size: 12px; color: var(--hp-text-muted);
        }
        .grading-elapsed span { font-weight: 700; color: var(--hp-primary); }

        /* ── 메인 콘텐츠 ── */
        .main-content {
            flex: 1;
            max-width: 900px; width: 100%;
            margin: 24px auto; padding: 0 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            align-items: start;
        }

        /* ── 카드 (problemDetail io-box 계열) ── */
        .card {
            background: var(--hp-surface);
            border: 1px solid var(--hp-border);
            border-radius: var(--hp-radius);
            padding: 18px 20px;
        }

        /* sec-label: problemDetail과 동일 */
        .sec-label {
            font-size: 10.5px; font-weight: 600; color: var(--hp-text-muted);
            letter-spacing: 0.9px; text-transform: uppercase; margin-bottom: 14px;
        }

        /* ── 요구사항 결과 (req-item 계열) ── */
        .req-result-list { display: flex; flex-direction: column; gap: 10px; }
        .req-result-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px;
            background: var(--hp-bg);
            border: 1px solid var(--hp-border);
            border-radius: var(--hp-radius-sm);
        }
        .req-score-badge {
            flex-shrink: 0; min-width: 42px; padding: 2px 6px; text-align: center;
            border-radius: 4px; font-size: 11px; font-weight: 700;
        }
        .req-score-pass { background: var(--hp-success-bg); color: var(--hp-success-text); }
        .req-score-warn { background: #FEF3C7; color: #D97706; }
        .req-info { flex: 1; min-width: 0; }
        .req-name { font-size: 12.5px; color: var(--hp-text); margin-bottom: 5px; }
        .req-bar-bg {
            height: 5px; background: var(--hp-border-soft);
            border-radius: 3px; overflow: hidden;
            border: 1px solid var(--hp-border);
        }
        .req-bar-fill {
            height: 100%; border-radius: 3px; width: 0%;
            transition: width 1s cubic-bezier(.4,0,.2,1) .3s;
        }

        /* ── 우측 패널 ── */
        .right-col { display: flex; flex-direction: column; gap: 16px; }

        /* io-box 스타일 통계 */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .stat-box {
            background: var(--hp-bg); border: 1px solid var(--hp-border);
            border-radius: var(--hp-radius-sm); padding: 12px 14px;
        }
        .stat-lbl { font-size: 10.5px; font-weight: 600; color: var(--hp-text-muted);
                    text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 4px; }
        .stat-val { font-size: 18px; font-weight: 700; color: var(--hp-text); }

        /* ── 하단 버튼 ── */
        .bottom-actions {
            max-width: 900px; width: 100%;
            margin: 0 auto 40px; padding: 0 24px;
            display: flex; justify-content: flex-end; gap: 8px;
        }
        .btn-secondary {
            padding: 9px 18px; border: 1px solid var(--hp-border);
            border-radius: var(--hp-radius-sm); font-size: 13px; font-weight: 600;
            color: var(--hp-text); background: var(--hp-surface);
            cursor: pointer; font-family: inherit; transition: background .15s;
        }
        .btn-secondary:hover { background: var(--hp-bg); }
        .btn-primary {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 9px 20px; background: var(--hp-primary);
            border: none; border-radius: var(--hp-radius-sm);
            font-size: 13px; font-weight: 600; color: #fff;
            cursor: pointer; font-family: inherit; transition: background .15s, transform .1s;
        }
        .btn-primary:hover  { background: var(--hp-primary-hover); }
        .btn-primary:active { transform: scale(.98); }
        .btn-primary svg { width: 13px; height: 13px; }
        .btn-primary:disabled, .btn-primary[disabled] {
            background: var(--hp-border); color: var(--hp-text-muted);
            cursor: not-allowed; transform: none;
        }
        .btn-primary:disabled:hover, .btn-primary[disabled]:hover {
            background: var(--hp-border);
        }
        /* 툴팁 */
        .tooltip-wrap { position: relative; display: inline-block; }
        .tooltip-wrap .tooltip {
            visibility: hidden; opacity: 0;
            background: #1A1A1A; color: #fff;
            font-size: 11px; white-space: nowrap;
            padding: 5px 10px; border-radius: 6px;
            position: absolute; bottom: calc(100% + 6px); left: 50%;
            transform: translateX(-50%);
            transition: opacity .15s; pointer-events: none;
        }
        .tooltip-wrap .tooltip::after {
            content: ''; position: absolute; top: 100%; left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent; border-top-color: #1A1A1A;
        }
        .tooltip-wrap:hover .tooltip { visibility: visible; opacity: 1; }

        /* 진입 애니메이션 */
        .fade-up { opacity: 0; transform: translateY(12px); animation: fadeUp .4s ease forwards; }
        .fade-up:nth-child(1) { animation-delay: .05s; }
        .fade-up:nth-child(2) { animation-delay: .15s; }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<!-- 헤더 -->
<header th:replace="~{common/header :: header('problems')}"></header>

<!-- 서브 헤더 -->
<div class="sub-header">
    <button class="btn-back" onclick="history.back()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
        목록
    </button>
    <div>
        <div class="sub-title" th:text="${submission.problemTitle}">로또 번호 생성기</div>
        <div class="sub-meta"
             th:text="${submission.evaluationType + ' 모드 · 채점 결과'}">
            STANDARD 모드 · 채점 결과
        </div>
    </div>
</div>

<!-- 스코어 히어로 -->
<div class="score-hero">
    <div>
        <span class="score-big" id="scoreNum" th:text="${submission.score}">88</span>
        <span class="score-denom"> / 100</span>
    </div>
    <div class="score-prob"
         th:text="${submission.problemTitle}">
        로또 번호 생성기
    </div>
    <span class="status-badge"
          th:classappend="${submission.status == 'PASSED'}  ? 'badge-passed'  :
                          (${submission.status == 'FAILED'} ? 'badge-failed'  :
                          (${submission.status == 'ERROR'}  ? 'badge-error'   : 'badge-grading'))"
          th:text="${submission.status}">
        PASSED
    </span>
</div>

<!-- 채점 중 배너 (GRADING 상태일 때만 표시) -->
<div class="grading-banner" th:if="${submission.status == 'GRADING'}">
    <div class="grading-card">
        <div class="spinner"></div>
        <div class="grading-title">AI가 채점하고 있습니다</div>
        <div class="grading-desc">잠시만 기다려 주세요. 채점 완료 후 결과가 자동으로 표시됩니다.</div>
        <div class="grading-elapsed"><span id="elapsed">0</span>초 경과</div>
    </div>
</div>

<!-- 메인 2열 (채점 완료 후에만 표시) -->
<div class="main-content" th:if="${submission.status != 'GRADING'}">

    <!-- 왼쪽: 요구사항별 달성도 -->
    <div class="card fade-up">
        <div class="sec-label">요구사항별 달성도</div>
        <div class="req-result-list">
            <!-- DB 연동 시 th:each 사용 -->
            <div class="req-result-item" th:each="req : ${requirementsResult}">
                <div class="req-score-badge"
                     th:classappend="${req.pct >= 80} ? 'req-score-pass' : 'req-score-warn'"
                     th:text="${req.score + '/' + req.maxScore}">0/0</div>
                <div class="req-info">
                    <div class="req-name" th:text="${req.description}">요구사항</div>
                    <div class="req-bar-bg">
                        <div class="req-bar-fill"
                             th:style="${req.pct >= 80} ? 'background:var(--hp-success-text)' : 'background:#D97706'"
                             th:attr="data-pct=${req.pct}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 오른쪽: 통계 + 피드백 -->
    <div class="right-col fade-up">
        <div class="card">
            <div class="sec-label">사용 통계</div>
            <div class="stat-grid">
                <div class="stat-box">
                    <div class="stat-lbl">사용 토큰</div>
                    <div class="stat-val" th:text="${submission.totalUserTokens}">312</div>
                </div>
                <div class="stat-box">
                    <div class="stat-lbl">대화 횟수</div>
                    <div class="stat-val" th:text="${submission.turnCount + '턴'}">2턴</div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- 하단 버튼 -->
<div class="bottom-actions">
    <button class="btn-secondary" onclick="location.href='/problems'">문제 목록으로</button>
    <button class="btn-secondary"
            th:onclick="|location.href='/submission/${submissionId}/review'|">
        내 풀이 보기
    </button>
    <!-- 통과한 경우: 활성 버튼 -->
    <button class="btn-primary"
            th:if="${submission.status == 'PASSED'}"
            th:onclick="|location.href='/community/problems/${submission.problemId}'|">
        다른 풀이 보기
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
        </svg>
    </button>
    <!-- 미통과: 비활성 + 툴팁 -->
    <span class="tooltip-wrap" th:if="${submission.status != 'PASSED'}">
        <button class="btn-primary" disabled>
            다른 풀이 보기
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
            </svg>
        </button>
        <span class="tooltip">통과 후 열람 가능합니다</span>
    </span>
</div>

<script th:inline="javascript">
    const SCORE  = /*[[${submission.score}]]*/ 0;
    const STATUS = /*[[${submission.status}]]*/ 'GRADING';

    window.addEventListener('DOMContentLoaded', () => {

        /* ── GRADING 상태: 폴링으로 채점 완료 감지 ── */
        if (STATUS === 'GRADING') {
            const SUBMISSION_ID = /*[[${submissionId}]]*/ 0;
            const elapsedEl = document.getElementById('elapsed');
            let elapsed = 0;

            // 1초마다 경과 시간 표시
            const elapsedTimer = setInterval(() => {
                elapsed++;
                if (elapsedEl) elapsedEl.textContent = elapsed;
            }, 1000);

            // 3초마다 상태 API 폴링
            const pollTimer = setInterval(async () => {
                try {
                    const res = await fetch(`/api/submissions/${SUBMISSION_ID}/status`);
                    if (!res.ok) return;
                    const data = await res.json();
                    if (data.status !== 'GRADING') {
                        clearInterval(pollTimer);
                        clearInterval(elapsedTimer);
                        location.reload();
                    }
                } catch (e) {
                    // 네트워크 오류 시 다음 주기에 재시도
                }
            }, 3000);

            return; // 아래 애니메이션은 채점 완료 후 실행
        }

        /* ── 채점 완료: 점수 카운트업 ── */
        const el = document.getElementById('scoreNum');
        if (el) {
            let cur = 0;
            const step = Math.max(1, Math.ceil(SCORE / 40));
            const t = setInterval(() => {
                cur = Math.min(cur + step, SCORE);
                el.textContent = cur;
                if (cur >= SCORE) clearInterval(t);
            }, 25);
        }

        /* 요구사항 바 애니메이션 */
        setTimeout(() => {
            document.querySelectorAll('.req-bar-fill').forEach(bar => {
                bar.style.width = (bar.dataset.pct || 0) + '%';
            });
        }, 350);
    });
</script>
</body>
</html>
