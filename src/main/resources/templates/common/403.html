<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>접근 권한 없음 · HowProm</title>

    <th:block th:replace="~{common/header :: styles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>

<!-- 헤더 -->
<div th:replace="~{common/header :: header('')}"></div>

<main class="hp-error">
    <div class="hp-error__inner">
        <div class="hp-error__icon">🔒</div>
        <h1 class="hp-error__code">403</h1>
        <h2 class="hp-error__title">접근 권한이 없어요</h2>
        <p class="hp-error__message">
            이 페이지는 관리자만 접근할 수 있습니다.<br>
            잘못 들어오셨다면 메인 페이지로 돌아가주세요.
        </p>
        <div class="hp-error__actions">
            <a th:href="@{/}" class="hp-btn hp-btn--primary">메인으로 →</a>
        </div>
    </div>
</main>

</body>
</html>
