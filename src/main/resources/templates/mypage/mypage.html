<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codemaze - 마이페이지</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/mypagestyle.css">
</head>
<body>

<div class="container">
    <div class="d-flex align-items-center mb-5 pb-3 border-bottom border-secondary">
        <h1 class="h2 flex-grow-1">마이페이지 <span class="h5 text-muted">(CodeMaze Dashboard)</span></h1>
    </div>

    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <div class="card-custom h-100 p-4">
                <div class="card-title mb-2">총 제출 횟수</div>
                <div class="stats-value">
                    <span th:text="${stats.totalSubmissions}">0</span><span class="fs-4 text-muted"> 회</span>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card-custom h-100 p-4">
                <div class="card-title mb-2">해결한 문제 수</div>
                <div class="stats-value">
                    <span th:text="${stats.totalSolvedProblems}">0</span><span class="fs-4 text-muted"> 개</span>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card-custom h-100 p-4">
                <div class="card-title mb-2">평균 통과율</div>
                <div class="stats-value">
                    <span th:text="${#numbers.formatDecimal(stats.passRate, 1, 1)}">0.0</span><span class="fs-4 text-muted"> %</span>
                </div>
            </div>
        </div>
    </div>

    <h2 class="h3 mb-4">최근 제출 이력</h2>
    <div class="table-responsive table-custom mb-4">
        <table class="table table-dark table-hover mb-0">
            <thead>
            <tr>
                <th style="width: 10%">제출 ID</th>
                <th style="width: 30%">문제 제목</th>
                <th style="width: 15%">평가 유형</th>
                <th style="width: 10%">점수</th>
                <th style="width: 15%">상태</th>
                <th style="width: 20%">제출 일시</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="sub : ${submissions}">
                <td class="font-monospace text-muted" th:text="'#' + ${sub.submissionId}">#1</td>
                <td>
                    <a th:href="'javascript:openDetail(' + ${sub.submissionId} + ')'"
                       class="problem-link"
                       th:text="${sub.problemTitle}">문제 제목</a>
                </td>
                <td>
                    <span th:text="${sub.evaluationType}">STANDARD</span>
                </td>
                <td class="fw-bold" th:text="${sub.score}">100</td>
                <td>
                    <span class="badge badge-status"
                          th:classappend="${sub.status == 'PASSED'} ? 'bg-success' : (${sub.status == 'ERROR'} ? 'bg-danger' : 'bg-warning text-dark')"
                          th:text="${sub.status}">PASSED</span>
                </td>
                <td class="text-muted" th:text="${#temporals.format(sub.createdAt, 'yyyy-MM-dd HH:mm')}">2026-05-20</td>
            </tr>
            <tr th:if="${#lists.isEmpty(submissions)}">
                <td colspan="6" class="text-center py-5 text-muted">제출 이력이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="d-flex justify-content-center mt-5" th:if="${page.totalPages > 1}">
        <nav aria-label="Page navigation">
            <ul class="pagination pagination-sm">
                <li class="page-item" th:classappend="${!page.hasPrevious()} ? 'disabled'">
                    <a class="page-link" th:href="@{/mypage(page=${page.number - 1})}" aria-label="Previous">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                    th:classappend="${i == page.number} ? 'active'">
                    <a class="page-link" th:href="@{/mypage(page=${i})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${!page.hasNext()} ? 'disabled'">
                    <a class="page-link" th:href="@{/mypage(page=${page.number + 1})}" aria-label="Next">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

</div>

<div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content text-start rounded-3" style="background-color: #222; border: 1px solid #444; color: #e0e0e0;">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="detailTitle">제출 기록 상세</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <p class="mb-4 text-muted">제출 ID: <strong id="modalSubmissionId" class="font-monospace">#</strong></p>

                <h6 class="h6 mb-2">최종 생성 코드</h6>
                <pre class="bg-dark p-3 rounded mb-4" id="modalFinalCode" style="color: var(--neon-blue); border: 1px solid #333; font-size: 0.9rem; overflow-x: auto;"></pre>

                <h6 class="h6 mb-2">LLM 피드백</h6>
                <div class="p-3 rounded mb-4" id="modalFeedback" style="background-color: #2a2a2a; border-left: 4px solid var(--neon-blue);"></div>

                <h6 class="h6 mb-2">대화 이력 (전환 전)</h6>
                <div id="modalConversation" class="small text-muted p-2 rounded bg-dark"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 3. 상세 보기 팝업 제어용 JS (alert 대신 Bootstrap 모달창 호출)
    function openDetail(submissionId) {
        fetch('/api/mypage/submissions/' + submissionId)
            .then(response => {
                if(!response.ok) throw new Error("권한이 없거나 없는 기록입니다.");
                return response.json();
            })
            .then(data => {
                // 💡 자바 JSON 데이터를 모달 영역에 동적으로 바인딩
                document.getElementById('modalSubmissionId').textContent = '#' + data.submissionId;
                document.getElementById('detailTitle').textContent = data.problemTitle;
                document.getElementById('modalFinalCode').textContent = data.finalCode;
                document.getElementById('modalFeedback').textContent = data.feedback || '피드백 정보가 없습니다.';

                // 대화 이력 (임시 처리: JSON 스트링 표시)
                document.getElementById('modalConversation').textContent = JSON.stringify(data.conversation, null, 2);

                // 모달 띄우기
                const detailModal = new bootstrap.Modal(document.getElementById('detailModal'));
                detailModal.show();
            })
            .catch(err => alert(err.message));
    }
</script>
</body>
</html>
