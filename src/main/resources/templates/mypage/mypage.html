<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 - HowProm</title>
    <style>
        :root {
            --hp-primary:       #5B47D6;
            --hp-primary-hover: #4a38c4;
            --hp-primary-soft:  #F0EEFB;
            --hp-bg:            #F5F6FA;
            --hp-surface:       #FFFFFF;
            --hp-text:          #1A1A1A;
            --hp-text-muted:    #6B7280;
            --hp-border:        #E5E7EB;
            --hp-border-soft:   #EEF0F3;
            --hp-success-bg:    #E6F7EC;
            --hp-success-text:  #1F9D55;
            --hp-danger-bg:     #FDECEC;
            --hp-danger-text:   #D14343;
            --hp-radius:        12px;
            --hp-radius-sm:     6px;
            --hp-shadow:        0 1px 2px rgba(0,0,0,0.03);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "Apple SD Gothic Neo", "Malgun Gothic", Roboto, sans-serif;
            background: var(--hp-bg);
            color: var(--hp-text);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }
        a { text-decoration: none; color: inherit; }

        /* ── 헤더 ── */
        .hp-header {
            background: var(--hp-surface);
            border-bottom: 1px solid var(--hp-border);
            position: sticky; top: 0; z-index: 100;
        }
        .hp-header__inner {
            max-width: 1400px; margin: 0 auto; padding: 0 32px;
            height: 64px; display: flex; align-items: center; justify-content: space-between;
        }
        .hp-header__left { display: flex; align-items: center; gap: 48px; }
        .hp-logo { font-size: 22px; font-weight: 700; color: var(--hp-primary); letter-spacing: -0.5px; }
        .hp-nav  { display: flex; align-items: center; gap: 8px; }
        .hp-nav__link {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 12px; font-size: 14px; color: var(--hp-text-muted);
            border-bottom: 2px solid transparent; transition: color .15s;
        }
        .hp-nav__link:hover { color: var(--hp-text); }
        .hp-nav__link--active { color: var(--hp-primary); border-bottom-color: var(--hp-primary); }
        .hp-nav__icon { flex-shrink: 0; }
        .hp-header__user {
            display: inline-flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; border-radius: 50%; color: var(--hp-text-muted);
            transition: background-color .15s;
        }
        .hp-header__user:hover { background: var(--hp-border-soft); }

        /* ── 페이지 헤더 ── */
        .page-header {
            background: var(--hp-surface);
            border-bottom: 1px solid var(--hp-border);
            padding: 20px 0;
        }
        .page-header__inner {
            max-width: 900px; margin: 0 auto; padding: 0 24px;
        }
        .page-title { font-size: 18px; font-weight: 700; color: var(--hp-text); }
        .page-subtitle { font-size: 13px; color: var(--hp-text-muted); margin-top: 2px; }

        /* ── 메인 콘텐츠 ── */
        .page-content {
            max-width: 900px; margin: 24px auto 48px; padding: 0 24px;
            display: flex; flex-direction: column; gap: 16px;
        }

        /* ── 통계 행 ── */
        .stats-row {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
        }
        .stat-card {
            background: var(--hp-surface);
            border: 1px solid var(--hp-border);
            border-radius: var(--hp-radius);
            padding: 18px 20px;
        }
        .stat-label {
            font-size: 10.5px; font-weight: 600; color: var(--hp-text-muted);
            text-transform: uppercase; letter-spacing: 0.9px; margin-bottom: 8px;
        }
        .stat-value {
            font-size: 28px; font-weight: 800; color: var(--hp-primary); letter-spacing: -1px;
        }

        /* ── 테이블 카드 ── */
        .table-card {
            background: var(--hp-surface);
            border: 1px solid var(--hp-border);
            border-radius: var(--hp-radius);
            overflow: hidden;
        }
        .table-card__head {
            padding: 16px 20px 0;
        }
        .sec-label {
            font-size: 10.5px; font-weight: 600; color: var(--hp-text-muted);
            letter-spacing: 0.9px; text-transform: uppercase; margin-bottom: 14px;
        }
        .sub-table {
            width: 100%; border-collapse: collapse;
        }
        .sub-table thead th {
            padding: 10px 16px;
            background: var(--hp-bg);
            border-bottom: 1px solid var(--hp-border);
            font-size: 11px; font-weight: 600; color: var(--hp-text-muted);
            text-transform: uppercase; letter-spacing: 0.6px;
            white-space: nowrap;
        }
        .sub-table thead th:first-child { text-align: left; }
        .sub-table thead th:not(:first-child) { text-align: center; }
        .sub-table tbody tr {
            border-bottom: 1px solid var(--hp-border-soft);
            cursor: pointer; transition: background .1s;
        }
        .sub-table tbody tr:last-child { border-bottom: none; }
        .sub-table tbody tr:hover { background: var(--hp-bg); }
        .sub-table tbody td {
            padding: 13px 16px; font-size: 13px;
        }
        .sub-table tbody td:first-child {
            font-weight: 600; color: var(--hp-text);
        }
        .sub-table tbody td:not(:first-child) { text-align: center; }
        .muted-cell { color: var(--hp-text-muted); }
        .score-cell { font-weight: 700; color: var(--hp-text); }
        .empty-row { text-align: center; padding: 48px 16px !important; color: var(--hp-text-muted); font-size: 13px; }

        /* 평가 유형 뱃지 */
        .eval-badge {
            display: inline-block; padding: 3px 9px; border-radius: 20px;
            font-size: 11px; font-weight: 600; letter-spacing: 0.3px;
        }
        .ev-standard  { background: var(--hp-primary-soft); color: var(--hp-primary); }
        .ev-efficiency{ background: var(--hp-success-bg);   color: var(--hp-success-text); }
        .ev-budget    { background: #FEF3C7; color: #D97706; }

        /* 상태 뱃지 */
        .status-badge {
            display: inline-block; padding: 3px 10px;
            border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.4px;
        }
        .badge-passed { background: var(--hp-success-bg); color: var(--hp-success-text); }
        .badge-failed { background: var(--hp-danger-bg);  color: var(--hp-danger-text); }
        .badge-error  { background: #FEF3C7; color: #D97706; }

        /* ── 페이지네이션 ── */
        .pagination {
            display: flex; justify-content: center; align-items: center; gap: 4px;
            padding: 16px;
            border-top: 1px solid var(--hp-border-soft);
        }
        .page-btn {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 32px; height: 32px; padding: 0 8px;
            border: 1px solid var(--hp-border); border-radius: var(--hp-radius-sm);
            font-size: 13px; color: var(--hp-text-muted); background: var(--hp-surface);
            cursor: pointer; transition: background .1s, color .1s;
        }
        .page-btn:hover:not(.disabled):not(.active) { background: var(--hp-bg); color: var(--hp-text); }
        .page-btn.active { background: var(--hp-primary); color: #fff; border-color: var(--hp-primary); font-weight: 600; }
        .page-btn.disabled { opacity: .4; pointer-events: none; }

    </style>
</head>
<body>

<!-- 헤더 -->
<header class="hp-header">
    <div class="hp-header__inner">
        <div class="hp-header__left">
            <a href="/" class="hp-logo">HowProm</a>
            <nav class="hp-nav">
                <a href="/" class="hp-nav__link">
                    <svg class="hp-nav__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    <span>대시보드</span>
                </a>
                <a href="/problems" class="hp-nav__link">
                    <svg class="hp-nav__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
                        <line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/>
                        <line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
                    </svg>
                    <span>문제</span>
                </a>
                <a href="/mypage" class="hp-nav__link hp-nav__link--active">
                    <svg class="hp-nav__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span>마이페이지</span>
                </a>
            </nav>
        </div>
        <div class="hp-header__right">
            <a href="/profile" class="hp-header__user" aria-label="내 정보">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </a>
        </div>
    </div>
</header>

<!-- 페이지 헤더 -->
<div class="page-header">
    <div class="page-header__inner">
        <div class="page-title">마이페이지</div>
        <div class="page-subtitle" th:text="${username}">userA</div>
    </div>
</div>

<!-- 메인 콘텐츠 -->
<div class="page-content">

    <!-- 통계 -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-label">총 제출</div>
            <div class="stat-value" th:text="${stats.totalSubmissions}">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">통과 문제</div>
            <div class="stat-value" th:text="${stats.totalSolvedProblems}">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">통과율</div>
            <div class="stat-value"
                 th:text="${#numbers.formatDecimal(stats.passRate, 1, 1) + '%'}">0%</div>
        </div>
    </div>

    <!-- 제출 목록 -->
    <div class="table-card">
        <div class="table-card__head">
            <div class="sec-label">내 제출 기록</div>
        </div>
        <table class="sub-table">
            <thead>
            <tr>
                <th>문제명</th>
                <th>모드</th>
                <th>점수</th>
                <th>사용 토큰</th>
                <th>제출일</th>
                <th>결과</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="sub : ${submissions}"
                th:onclick="|location.href='/result/${sub.submissionId}'|"
                style="cursor:pointer;">
                <td th:text="${sub.problemTitle}">버블 정렬 알고리즘 구현</td>
                <td>
                    <span class="eval-badge"
                          th:classappend="${sub.evaluationType == 'STANDARD'}   ? 'ev-standard'   :
                                         (${sub.evaluationType == 'EFFICIENCY'} ? 'ev-efficiency' : 'ev-budget')"
                          th:text="${sub.evaluationType}">STANDARD</span>
                </td>
                <td class="score-cell" th:text="${sub.score + '점'}">88점</td>
                <td class="muted-cell" th:text="${sub.totalUserTokens}">312</td>
                <td class="muted-cell"
                    th:text="${#temporals.format(sub.createdAt, 'yyyy.MM.dd')}">2025.05.11</td>
                <td>
                    <span class="status-badge"
                          th:classappend="${sub.status == 'PASSED'} ? 'badge-passed' :
                                         (${sub.status == 'FAILED'} ? 'badge-failed' : 'badge-error')"
                          th:text="${sub.status}">PASSED</span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(submissions)}">
                <td colspan="6" class="empty-row">제출 이력이 없습니다.</td>
            </tr>
            </tbody>
        </table>

        <!-- 페이지네이션 -->
        <div class="pagination" th:if="${page.totalPages > 1}">
            <a class="page-btn"
               th:classappend="${!page.hasPrevious()} ? 'disabled'"
               th:href="@{/mypage(page=${page.number - 1})}">‹</a>
            <a class="page-btn"
               th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
               th:classappend="${i == page.number} ? 'active'"
               th:href="@{/mypage(page=${i})}"
               th:text="${i + 1}">1</a>
            <a class="page-btn"
               th:classappend="${!page.hasNext()} ? 'disabled'"
               th:href="@{/mypage(page=${page.number + 1})}">›</a>
        </div>
    </div>
</div>

</body>
</html>
