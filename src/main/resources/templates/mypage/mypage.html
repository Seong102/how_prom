<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codemaze - 마이페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/mypagestyle.css">
</head>
<body>

<div class="proto-wrap container">

    <div class="app-header mb-4">
        <div class="app-logo">Code<span>·</span>Maze</div>
        <div class="app-nav d-none d-md-flex">
            <a href="/dashboard">대시보드</a>
            <a href="/problems">문제 목록</a>
            <a href="/mypage" class="active">마이페이지</a>
        </div>

        <!-- 인증 구현완료시 변경 <div class="avatar" sec:authentication="name">유저명</div>  -->
        <div class="app-header-right">
            <div class="avatar" th:text="${username != null ? username : '유저'}">유저</div>
        </div>
    </div>

    <div class="screen-body p-4 shadow-sm">
        <div class="section-title">내 제출 기록</div>

        <div class="table-responsive">
            <table class="my-table">
                <thead>
                <tr>
                    <th class="text-left" style="width: 30%">문제명</th>
                    <th class="text-center" style="width: 15%">모드</th>
                    <th class="text-center" style="width: 15%">점수</th>
                    <th class="text-center" style="width: 15%">사용 토큰</th>
                    <th class="text-center" style="width: 15%">제출일</th>
                    <th class="text-center" style="width: 10%">상태</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="sub : ${submissions}" th:onclick="'openDetail(' + ${sub.submissionId} + ')'">
                    <td class="text-left fw-semibold" style="color: #374151;" th:text="${sub.problemTitle}">로또 번호 생성기</td>
                    <td class="text-center">
                        <span class="badge-custom"
                              th:classappend="${sub.evaluationType == 'STANDARD'} ? 'badge-violet' : (${sub.evaluationType == 'EFFICIENCY'} ? 'badge-green' : 'badge-amber')"
                              th:text="${sub.evaluationType}">STANDARD</span>
                    </td>
                    <td class="text-center"><span class="score-text" th:text="${sub.score} + '점'">88점</span></td>
                    <td class="text-center" style="color: #4b5563;" th:text="${sub.totalUserTokens}">312</td>
                    <td class="text-center" style="color: #6b7280;" th:text="${#temporals.format(sub.createdAt, 'yyyy.MM.dd')}">2025.05.11</td>
                    <td class="text-center">
                        <span th:class="${sub.status == 'PASSED'} ? 'status-pass' : 'status-fail'"
                              th:text="${sub.status}">PASSED</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(submissions)}">
                    <td colspan="6" class="text-center py-5" style="color: #9ca3af;">제출 이력이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="table-caption mt-3">
            행을 클릭하면 전체 대화 이력 및 상세 결과를 볼 수 있습니다.
        </div>

        <div class="d-flex justify-content-center mt-4" th:if="${page.totalPages > 1}">
            <nav aria-label="Page navigation">
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${!page.hasPrevious()} ? 'disabled'">
                        <a class="page-link" th:href="@{/mypage(page=${page.number - 1})}">&laquo;</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                        th:classappend="${i == page.number} ? 'active'">
                        <a class="page-link" th:href="@{/mypage(page=${i})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${!page.hasNext()} ? 'disabled'">
                        <a class="page-link" th:href="@{/mypage(page=${page.number + 1})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content text-start border-0 shadow-lg" style="background-color: #ffffff; color: #374151;">
            <div class="modal-header" style="border-bottom: 1px solid #f3f4f6;">
                <h5 class="modal-title fw-bold" id="detailTitle" style="color: #1e1b4b;">제출 기록 상세</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <p class="mb-3" style="font-size: 13px; color: #6b7280;">제출 식별 번호: <strong id="modalSubmissionId" class="font-monospace text-dark">#</strong></p>

                <div class="section-title mb-2" style="color: #4f46e5;">최종 생성 코드</div>
                <pre class="bubble-ai p-3 rounded mb-4 w-100" id="modalFinalCode" style="white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; background-color: #f9fafb; border: 1px solid #f3f4f6; color: #374151;"></pre>

                <div class="section-title mb-2" style="color: #4f46e5;">LLM 피드백</div>
                <div class="feedback-box p-3 rounded mb-4" id="modalFeedback"></div>

                <div class="section-title mb-2">원시 대화 데이터 (JSON)</div>
                <pre id="modalConversation" class="p-2 rounded font-monospace" style="font-size: 11px; background-color: #f9fafb; border: 1px solid #f3f4f6; color: #6b7280; max-height: 150px; overflow-y: auto;"></pre>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function openDetail(submissionId) {
        fetch('/api/mypage/submissions/' + submissionId)
            .then(response => {
                if(!response.ok) throw new Error("권한이 없거나 삭제된 제출 내역입니다.");
                return response.json();
            })
            .then(data => {
                document.getElementById('modalSubmissionId').textContent = '#' + data.submissionId;
                document.getElementById('detailTitle').textContent = data.problemTitle;
                document.getElementById('modalFinalCode').textContent = data.finalCode;
                document.getElementById('modalFeedback').textContent = '💬 ' + (data.feedback || '생성된 피드백 코멘트가 존재하지 않습니다.');
                document.getElementById('modalConversation').textContent = JSON.stringify(data.conversation, null, 2);

                const detailModal = new bootstrap.Modal(document.getElementById('detailModal'));
                detailModal.show();
            })
            .catch(err => alert(err.message));
    }
</script>
</body>
</html>
