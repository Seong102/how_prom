<!--login.html-->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>로그인 · HowProm</title>
	<link rel="stylesheet" th:href="@{/css/login.css}"> 
</head>	
<body>
	<a th:href="@{/}" class="auth-logo">HowProm</a>
	
	<form class="auth-card" th:action="@{/login}" method="post">
		
		<h1 class="auth-card__title">로그인</h1>
		<!--로그인 실패 메시지-->
		<div th:if="${param.error}" class="alert alert--error">
			아이디 또는 비밀번호가 올바르지 않습니다.
		</div>
		
		<!--로그아웃 완료 메시지-->
		<div th:if="${param.logout}" class="alert alert--info">
			로그아웃되었습니다.
		</div>
		
		<div class="form-group">
			<div class="form-group__header">
				<label class="form-label" for="username">아이디</label>
			</div>
			<input type="text" 
					 id="username" 
					 name="email"
					 class="form-input" 
					 autocomplete="username"
					 autofocus
					 required>
		</div>
		
		<div class="form-group">
			<div class="form-group__header">
				<label class="form-label" for="password">비밀번호</label>
				<a th:href="@{/auth/find-password}" class="form-link">비밀번호 찾기</a>
			</div>
			<input type="password"
					 id="password"
					 name="password"
					 class="form-input"
					 autocomplete="current-password"
					 required>
		</div>
		
		<div class="auth-actions">
			<label class="checkbox-group">
				<input type="checkbox" name="remember-me" value="true">
				<span>로그인 유지</span>
			</label>
			<button type="submit" class="btn-primary">로그인</button>
		</div>
		<div class="auth-divider">간편 로그인</div>
		<div class="social-logins">
			<!--Google 로그인-->
			<a th:href="@{/oauth2/authorization/google}"
				class="social-btn"
				title="Google 로그인"
				aria-label="Google 로그인">
				<svg width="22" height="22" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
				</svg>
			</a>
			
			<!--Naver 로그인-->
			<a th:href="@{/oauth2/authorization/naver}"
				class="social-btn social-btn--naver"
				title="네이버 로그인"
				aria-label="네이버 로그인">
			</a>
			
			<!--Kakao 로그인-->
			<a th:href="@{/oauth2/authorization/kakao}"
				class="social-btn social-btn--kakao"
				title="카카오 로그인"
				aria-label="카카오 로그인">
			</a>
		</div>
		<div class="auth-footer">
			아이디가 없나요? <a th:href="@{/auth/signup}">회원가입</a>
		</div>
	</form>
</body>
</html>
