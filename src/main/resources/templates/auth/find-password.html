<!--find-password.html-->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기 · HowProm</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/signup.css}">
</head>
<body>
    <a th:href="@{/}" class="auth-logo">HowProm</a>

    <form class="auth-card" th:action="@{/auth/find-password}" method="post">

        <h1 class="auth-card__title">비밀번호 찾기</h1>

        <!-- 발송 완료 메시지 -->
        <div th:if="${param.sent}" class="alert alert--info">
            입력하신 이메일로 임시 비밀번호를 발송했습니다.<br>
            메일함을 확인해주세요.
        </div>

        <p style="font-size: 14px; color: var(--hp-text-muted); margin-bottom: 20px; line-height: 1.6;">
            가입 시 사용한 이메일을 입력하시면<br>
            임시 비밀번호를 보내드립니다.
        </p>

        <!-- 이메일 -->
        <div class="form-group">
            <div class="form-group__header">
                <label class="form-label" for="email">이메일</label>
            </div>
            <input type="email"
                   id="email"
                   name="email"
                   class="form-input"
                   placeholder="user@example.com"
                   autocomplete="email"
                   autofocus
                   required>
        </div>

        <!-- 하단 버튼 -->
        <div class="auth-buttons">
            <a th:href="@{/auth/login}" class="auth-button auth-button--secondary">뒤로 가기</a>
            <button type="submit" class="auth-button auth-button--primary">임시 비밀번호 발송</button>
        </div>

    </form>
</body>
</html>
